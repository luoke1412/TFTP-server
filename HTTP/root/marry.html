<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚礼邀请函</title>

    <style type="text/css">
        * {
            padding: 0;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        /* 喜庆但不喧闹的底色，留白多一点，让正文好写 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to top, #fff5f5 0%, #ffe9ec 100%);
            font-family: "宋体", "Microsoft YaHei", serif;
        }

        .card {
            width: 560px;
            max-width: 90%;
            background: #fffdfb;
            border: 1px solid #f0d9d9;
            border-radius: 10px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        }

        .card .title {
            font-size: 30px;
            letter-spacing: 4px;
            color: #c0392b;
        }

        .card .subtitle {
            margin-top: 10px;
            font-size: 15px;
            color: #8a5a5a;
        }

        /* 正文区：内容你自己填 */
        .content {
            margin-top: 28px;
            min-height: 220px;
            font-size: 16px;
            line-height: 1.9;
            color: #5a4a4a;
            text-align: left;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #e8c4c4;
            margin: 24px auto;
        }

        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #b59a9a;
        }
    </style>

</head>
<body>
    <div class="card">
        <div class="title">婚礼邀请函</div>
        <div class="subtitle">诚挚邀请您见证我们的幸福时刻</div>

        <div class="divider"></div>

        <!-- 正文内容在这里填：新人、时间、地点、祝语等 -->
        <div class="content">
            <p>（正文待填写）</p>
        </div>

        <div class="divider"></div>

        <div class="footer">期待您的到来</div>
    </div>
</body>
</html>
