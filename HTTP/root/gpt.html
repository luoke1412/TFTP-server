<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT</title>

    <style type="text/css">
        * {
            padding: 0;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        /* 整屏聊天界面，仿 chatgpt.com 朴素样式 */
        body {
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .sidebar {
            width: 260px;
            background: #212121;
            color: #fff;
            padding: 20px 0;
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 16px;
            padding: 12px 20px;
            border-bottom: 1px solid #3a3a3a;
        }

        .sidebar .new-chat {
            padding: 14px 20px;
            border-bottom: 1px solid #3a3a3a;
            font-size: 14px;
            color: #ddd;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .main h1 {
            text-align: center;
            font-size: 22px;
            font-weight: normal;
            color: #333;
            padding: 24px 0;
        }

        /* 聊天区：消息一条条往下排 */
        .chat {
            flex: 1;
            overflow-y: auto;
            max-width: 760px;
            width: 88%;
            margin: 0 auto;
        }

        .msg {
            margin: 12px 0;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .msg.user {
            background: #e7f3ff;
            text-align: right;
            margin-left: 8%;
        }

        .msg.bot {
            background: #fff;
            border: 1px solid #ececec;
            margin-right: 8%;
        }

        /* 底部输入框 */
        .input-bar {
            max-width: 760px;
            width: 88%;
            margin: 8px auto 20px;
            display: flex;
            gap: 8px;
        }

        .input-bar input {
            flex: 1;
            height: 44px;
            border: 1px solid #d1d1d1;
            border-radius: 22px;
            padding: 0 18px;
            font-size: 15px;
            outline: none;
        }

        .input-bar button {
            height: 44px;
            width: 44px;
            border: none;
            border-radius: 50%;
            background: #303030;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
    </style>

    <script>
        // 发一条消息：先把内容显示在界面上，同时用 XHR 把内容 POST 给后端
        // 后端的 handle_gpt 会回一段 JS，让浏览器跳到 /marry.html
        function sendMessage() {
            var xhr = new XMLHttpRequest();
            var content = document.getElementById("chat-input").value;

            if (content === "") return;

            // 把用户的话显示到聊天区
            var div = document.createElement("div");
            div.className = "msg user";
            div.textContent = content;
            document.getElementById("chat").appendChild(div);
            document.getElementById("chat-input").value = "";

            var url = "";  // 请求本地服务器
            xhr.open("POST", url, true);
            // 带上 gpt 标记，后端好认出来这是 gpt.html 发来的请求
            xhr.send("gpt=1&content=" + encodeURIComponent(content));
        }

        // 回车也能发
        function onEnterKey(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>

</head>
<body>
    <div class="sidebar">
        <h2>ChatGPT</h2>
        <div class="new-chat">+ New chat</div>
    </div>

    <div class="main">
        <h1>ChatGPT</h1>

        <div class="chat" id="chat">
            <div class="msg bot">你好，有什么可以帮你的吗？</div>
        </div>

        <div class="input-bar">
            <input type="text" id="chat-input" placeholder="输入消息..." onkeypress="onEnterKey(event)">
            <button onclick="sendMessage()">↑</button>
        </div>
    </div>
</body>
</html>
